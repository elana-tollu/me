version: 1
applications:
  - appRoot: infra
    backend:
      phases:
        build:
          commands:
            - INFRA_DIR=$(pwd)
            - cd ../lambdas/progress
            - npm ci --cache .npm --prefer-offline
            - npm run build
            - cd $INFRA_DIR
            - npm ci --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
      cache:
        paths:
          - .npm/**/*
          - ../lambdas/progress/node_modules/**/*
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../site
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: ../site/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - ../site/node_modules/**/*
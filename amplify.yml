version: 1
applications:
  - appRoot: .
    backend:
      phases:
        preBuild:
          commands:
            - cd lambdas/progress && npm ci --cache .npm --prefer-offline
        build:
          commands:
            - cd lambdas/progress && npm run build
      artifacts:
        baseDirectory: lambdas/progress/dist
        files:
          - '**/*'
      cache:
        paths:
          - lambdas/progress/node_modules/**/*
    frontend:
      phases:
        preBuild:
          commands:
            - cd site
            - npm ci
        build:
          commands:
            - cd site
            - npm run build
      artifacts:
        baseDirectory: site/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - site/node_modules/**/*
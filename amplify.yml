version: 1
applications:
  - appRoot: infra
    backend:
      phases:
        preBuild:
          commands:
            - cd ../lambdas/progress && npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      cache:
        paths:
          - ../lambdas/progress/node_modules/**/*
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../site
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: ../site/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - ../site/node_modules/**/*
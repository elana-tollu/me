version: 1
applications:
  - appRoot: site
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
  - appRoot: .
    backend:
      phases:
        preBuild:
          commands:
            - cd lambdas/progress
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - cd lambdas/progress
            - npm run build
      artifacts:
        baseDirectory: lambdas/progress/dist
        files:
          - '**/*'
      cache:
        paths:
          - lambdas/progress/node_modules/**/*
